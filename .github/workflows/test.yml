name: UNCHAINED9 Contract Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run fork tests
        env:
          ARBITRUM_RPC: ${{ secrets.ARBITRUM_RPC }}
        run: npm test
