    { address: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48', symbol: 'USDC', name: 'USD Coin',        decimals: 6  },
  ];

  var MOCK_PRICES = {
    '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2': { usd: 3247.82,  change24h:  2.61, updatedAt: 0 },
    '0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599': { usd: 67420.00, change24h:  1.14, updatedAt: 0 },
    '0x514910771AF9Ca656af840dff83E8264EcF986CA': { usd: 14.23,    change24h: -0.52, updatedAt: 0 },
    '0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984': { usd: 8.20,     change24h:  3.08, updatedAt: 0 },
    '0x6B175474E89094C44Da98b954EedeAC495271d0F': { usd: 1.00,     change24h:  0.01, updatedAt: 0 },
    '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48': { usd: 1.00,     change24h: -0.01, updatedAt: 0 },
  };

  /* Volume — Phase 7C wires Uniswap API; mock values bridge until then */
  var MOCK_VOLUMES = {
    '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2': 18400000000,
    '0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599':  2300000000,
    '0x514910771AF9Ca656af840dff83E8264EcF986CA':   450000000,
    '0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984':   180000000,
    '0x6B175474E89094C44Da98b954EedeAC495271d0F':   890000000,
    '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48':  5200000000,
  };

  /* ── Containers ──────────────────────────────────────────────────*/
  var desktopList   = document.getElementById('token-list');
  var mobileList    = document.getElementById('mobile-token-list');
  var desktopSearch = document.getElementById('token-search');
  var mobileSearch  = document.getElementById('mobile-token-search');

  /* Active search query — shared across both inputs */
  var currentQuery = '';

  /* ── Helpers ─────────────────────────────────────────────────────*/

  /*
   * getLogoUrl — Trust Wallet Assets CDN.
   * ethers.utils.getAddress() checksums the address — required by CDN path.
   */
  function getLogoUrl(address) {
    var cs = address;
    try { cs = ethers.utils.getAddress(address); } catch (_) {}
    return 'https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/ethereum/assets/'
      + cs + '/logo.png';
  }

  function formatPrice(usd) {
    if (usd >= 10000) return '$' + usd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (usd >= 1)     return '$' + usd.toFixed(2);
    return '$' + usd.toFixed(4);
  }

  function formatChange(change) {
    return (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
  }

  function formatVolume(vol) {
    if (!vol)       return '';
    if (vol >= 1e9) return '$' + (vol / 1e9).toFixed(1) + 'B';
    if (vol >= 1e6) return '$' + (vol / 1e6).toFixed(1) + 'M';
    if (vol >= 1e3) return '$' + (vol / 1e3).toFixed(1) + 'K';
    return '$' + Math.round(vol);
  }

  /*
   * buildSparklineSVG — static placeholder for Phase 4B.
   * stroke="currentColor" so .sparkline-up/.sparkline-dn drive colour
   * via CSS: color: var(--up) / color: var(--dn).
   */
  function buildSparklineSVG(isUp) {
    var up = '2,20 6,17 11,18 17,13 23,15 29,10 35,12 41,7 47,9 54,5';
    var dn = '2,5  6,8  11,6  17,11 23,9  29,14 35,12 41,17 47,14 54,20';
    return '<svg width="56" height="24" viewBox="0 0 56 24" fill="none" aria-hidden="true">'
      + '<polyline points="' + (isUp ? up : dn) + '"'
      + ' stroke="currentColor" stroke-width="1.5"'
      + ' stroke-linecap="round" stroke-linejoin="round"/>'
      + '</svg>';
  }

  /* ── Row builders ────────────────────────────────────────────────*/

  function buildSkeletonRow() {
    var row = document.createElement('div');
    row.className = 'token-row token-row--skeleton';
    row.innerHTML =
      '<div class="token-row-logo">'
      +   '<div class="skeleton" style="width:28px;height:28px;border-radius:50%"></div>'
      + '</div>'
      + '<div class="token-row-info">'
      +   '<div class="skeleton" style="width:90px;height:11px;margin-bottom:6px"></div>'
      +   '<div class="skeleton" style="width:40px;height:9px"></div>'
      + '</div>'
      + '<div class="token-row-price">'
      +   '<div class="skeleton" style="width:72px;height:11px;margin-bottom:6px"></div>'
      +   '<div class="skeleton" style="width:48px;height:9px"></div>'
      + '</div>';
    return row;
  }

  function buildTokenRow(token, price) {
    var row = document.createElement('div');
    row.className = 'token-row';
    row.setAttribute('data-address', token.address);
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');

    var change      = price ? price.change24h : 0;
    var changeClass = change > 0 ? 'up' : change < 0 ? 'dn' : '';
    var changeText  = price ? formatChange(change) : '\u2014';
    var priceText   = price ? formatPrice(price.usd) : '\u2014';
    var volumeText  = formatVolume(MOCK_VOLUMES[token.address]);
    var isUp        = change >= 0;

    row.innerHTML =
      '<div class="token-row-logo">'
      +   '<img class="token-logo" src="' + getLogoUrl(token.address) + '"'
      +   ' alt="' + token.symbol + '" width="28" height="28">'
      +   '<div class="token-logo-fallback" style="display:none">' + token.symbol[0] + '</div>'
      + '</div>'
      + '<div class="token-row-info">'
      +   '<span class="token-row-name">'   + token.name   + '</span>'
      +   '<span class="token-row-symbol">' + token.symbol + '</span>'
      +   '<span class="token-row-chain">Ethereum</span>'
      + '</div>'
      + '<div class="token-row-sparkline ' + (isUp ? 'sparkline-up' : 'sparkline-dn') + '">'
      +   buildSparklineSVG(isUp)
      + '</div>'
      + '<div class="token-row-price">'
      +   '<span class="token-row-usd" data-address="' + token.address + '">' + priceText + '</span>'
      +   '<span class="token-row-change ' + changeClass + '">' + changeText + '</span>'
      +   (volumeText ? '<span class="token-row-volume">' + volumeText + '</span>' : '')
      + '</div>';

    /* Logo fallback — hide img, show initial circle on load error */
    var img      = row.querySelector('.token-logo');
    var fallback = row.querySelector('.token-logo-fallback');
    img.onerror  = function () {
      img.style.display      = 'none';
      fallback.style.display = 'flex';
    };

    /* Click + keyboard navigation */
    row.addEventListener('click',   function () { navigateToToken(token.address); });
    row.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        navigateToToken(token.address);
      }
    });

    return row;
  }

  function buildEmptyState(query) {
    var div = document.createElement('div');
    div.className = 'token-list-empty';
    div.innerHTML = '<span class="token-list-empty-label">'
      + (query ? 'No results for \u201c' + query + '\u201d' : 'No tokens available')
      + '</span>';
    return div;
  }

  function buildErrorState() {
    var div = document.createElement('div');
    div.className = 'token-list-error';
    div.innerHTML =
      '<span class="token-list-error-label">Price feed unavailable</span>'
      + '<button class="token-list-retry">Retry</button>';
    div.querySelector('.token-list-retry').addEventListener('click', boot);
    return div;
  }

  /* ── Navigation ──────────────────────────────────────────────────*/

  function navigateToToken(address) {
    if (!window.STATE || !window.setState) return;
    if (window.innerWidth >= 768) {
      setState({ rightPanel: 'token', token: address });
    } else {
      setState({ prevMobileView: STATE.mobileView, mobileView: 'token', token: address });
    }
  }

  /* ── Render ──────────────────────────────────────────────────────*/

  /*
   * renderToContainer — sole DOM-writing function.
   * Called identically for desktop (#token-list) and mobile (#mobile-token-list).
   * animate=true on initial load (staggered entrance).
   * animate=false on search filter (instant feels right; no lag).
   */
  function renderToContainer(container, tokens, prices, animate) {
    container.innerHTML = '';

    if (!tokens || !tokens.length) {
      container.appendChild(buildEmptyState(currentQuery));
      return;
    }

    tokens.forEach(function (token, i) {
      var row = buildTokenRow(token, prices ? prices[token.address] : null);

      if (animate) {
        row.style.opacity   = '0';
        row.style.transform = 'translateY(4px)';
      }

      container.appendChild(row);

      if (animate) {
        setTimeout(function (r) {
          r.style.transition = 'opacity 220ms var(--ease-out), transform 220ms var(--ease-spr)';
          r.style.opacity    = '1';
          r.style.transform  = 'translateY(0)';
        }.bind(null, row), i * 40);
      }
    });
  }

  function renderBoth(tokens, prices, animate) {
    renderToContainer(desktopList, tokens, prices, animate);
    renderToContainer(mobileList,  tokens, prices, animate);
  }

  function showSkeletons() {
    [desktopList, mobileList].forEach(function (c) {
      c.innerHTML = '';
      for (var s = 0; s < 3; s++) { c.appendChild(buildSkeletonRow()); }
    });
  }

  /*
   * fadeSkeletonsThenRender — fades any skeleton rows in both containers
   * then renders real rows with staggered entrance animation.
   */
  function fadeSkeletonsThenRender(tokens, prices) {
    var skeletons = Array.from(desktopList.querySelectorAll('.token-row--skeleton'))
      .concat(Array.from(mobileList.querySelectorAll('.token-row--skeleton')));

    if (!skeletons.length) {
      renderBoth(tokens, prices, true);
      return;
    }

    skeletons.forEach(function (s) {
      s.style.transition = 'opacity 160ms var(--ease-in)';
      s.style.opacity    = '0';
    });

    setTimeout(function () { renderBoth(tokens, prices, true); }, 160);
  }

  /* ── Search ──────────────────────────────────────────────────────*/

  function applyFilter(query) {
    currentQuery = query;
    var all    = (STATE && STATE.tokenList) ? STATE.tokenList : [];
    var prices = (STATE && STATE.prices)    ? STATE.prices    : {};
    var lower  = query.toLowerCase().trim();

    var filtered = lower ? all.filter(function (t) {
      return t.name.toLowerCase().indexOf(lower)    > -1
          || t.symbol.toLowerCase().indexOf(lower)  > -1
          || t.address.toLowerCase().indexOf(lower) > -1;
    }) : all;

    renderBoth(filtered, prices, false);
  }

  function wireSearch(input, peer) {
    if (!input) return;
    input.addEventListener('input', function () {
      if (peer) peer.value = input.value;  /* keep inputs in sync */
      applyFilter(input.value);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        input.value = '';
        if (peer) peer.value = '';
        applyFilter('');
      }
    });
  }

  /* ── State events ────────────────────────────────────────────────*/

  /*
   * state:tokenList — fires whenever the list changes:
   *   now  → mock load below
   *   7C   → Uniswap metadata for active network's Chainlink feeds
   *   8B   → network switch; new network's token set flows in
   *
   * Search resets on list change so results always reflect fresh data.
   */
  document.addEventListener('state:tokenList', function () {
    var tokens = (STATE && STATE.tokenList) ? STATE.tokenList : [];
    var prices = (STATE && STATE.prices)    ? STATE.prices    : {};
    if (!tokens.length) return;
    currentQuery = '';
    if (desktopSearch) desktopSearch.value = '';
    if (mobileSearch)  mobileSearch.value  = '';
    fadeSkeletonsThenRender(tokens, prices);
  });

  /*
   * state:prices — fires on every Chainlink block update (Phase 7A).
   * Re-renders in place without animation; honours active search.
   */
  document.addEventListener('state:prices', function () {
    var tokens = (STATE && STATE.tokenList) ? STATE.tokenList : [];
    var prices = (STATE && STATE.prices)    ? STATE.prices    : {};
    if (!tokens.length) return;
    if (currentQuery) {
      applyFilter(currentQuery);
    } else {
      renderBoth(tokens, prices, false);
    }
  });

  /* ── Boot ────────────────────────────────────────────────────────*/

  function boot() {
    showSkeletons();

    /*
     * 800ms simulated async load — mirrors real Chainlink + Uniswap latency.
     * Phase 7A: remove this timeout block entirely.
     * setState({ tokenList, prices }) is called from the Chainlink/Uniswap
     * callbacks instead. The skeleton → loaded transition stays unchanged.
     */
    setTimeout(function () {
      setState({
        tokenList: MOCK_TOKEN_LIST,
        prices:    MOCK_PRICES,
      });
    }, 800);
  }

  /* Wire search inputs before boot so they are ready when data arrives */
  wireSearch(desktopSearch, mobileSearch);
  wireSearch(mobileSearch,  desktopSearch);

  boot();

}());
</script>

<!-- ── Phase 4B — Price Chart ───────────────────────────────────── -->
<script>
(function () {
  'use strict';

  /*
   * ARCHITECTURE
   * ─────────────────────────────────────────────────────────────────
   * Data shape:  STATE.priceHistory[address][tf].prices
   *              = [[timestamp_ms, price_usd], ...]
   *              Phase 7B wires real Uniswap API data into this exact
   *              shape — zero chart-side changes required.
   *
   * renderChart(slot, address, tf)
   *   → injects HTML (toggles + canvas wrap) into .token-panel-chart-slot
   *   → schedules RAF → positionIndicator + mountChart
   *
   * mountChart(slot, address, tf)
   *   → replaces canvas via cloneNode (clears all prior listeners)
   *   → sizes for DPR, builds coordinate transforms
   *   → wires mousemove / touch → nearest-point snap
   *   → crosshair updates .token-panel-usd + .token-panel-change
   *     in the containing .token-panel (Uniswap / Coinbase pattern)
   *   → fires 600ms ease-out draw-in animation
   *
   * Toggle click → mountChart on same slot, new canvas, new timeframe.
   *
   * Panel re-render (state:token, state:mobileView, panel:render)
   * → tryMount schedules RAF after 4A injects fresh panel.
   * ─────────────────────────────────────────────────────────────────
   */

  /* ── Mock price history ──────────────────────────────────────────
   * Canonical OBSIDEUM schema. Seeded walk — deterministic, no jitter.
   * Phase 7B replaces per-token data with real Uniswap API responses.
   * Access: STATE.priceHistory[address][tf].prices → [[ts_ms, usd], …]
   * ─────────────────────────────────────────────────────────────── */
  var MOCK_PRICE_HISTORY = (function () {
    var now = Date.now();

    /* Deterministic pseudo-random in (-1, 1) — approximates normal via sum of uniforms */
    function pr(n) {
      var x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
      return x - Math.floor(x);
    }
    function randn(seed) {
      /* Box-Muller via two uniform samples — better than single uniform for price walks */
      var u1 = Math.max(1e-10, pr(seed));
      var u2 = pr(seed + 0.5);
      return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
    }

    /*
     * walk(base, count, stepMs, stepVol, seed)
     *
     * stepVol — per-step standard deviation as a fraction of price.
     *           Derived from annualised vol: stepVol = annVol / sqrt(stepsPerYear).
     *
     * Mean reversion (κ = 0.08 per step) keeps price from drifting
     * unboundedly far from base — realistic for stablecoins and caps
     * exaggerated moves for volatile assets.
     *
     * Final point is pinned to the live price so the chart
     * always terminates at the current quote.
     */
    function walk(base, count, stepMs, stepVol, seed) {
      var pts   = [];
      var kappa = 0.08;   /* mean-reversion strength per step          */
      /* start price within ±1 sigma of base */
      var p = base * (1 + randn(seed) * stepVol);

      for (var i = count; i >= 0; i--) {
        p = Math.max(base * 0.001, p);  /* floor: price never goes negative */
        pts.push([now - i * stepMs, +(p.toFixed(p >= 1 ? 2 : 6))]);
        var drift = kappa * (base - p) / base;  /* pull toward base */
        var noise = randn(seed + i * 3 + 7) * stepVol;
        p = p * (1 + drift + noise);
      }
      pts[pts.length - 1][1] = base;   /* pin terminal point to live price */
      return { prices: pts };
    }

    /*
     * Per-token daily volatility (annVol → daily = annVol / sqrt(252)).
     * These match real observed crypto vols (2024–2026 avg):
     *   WETH  ≈ 70% ann  → ~4.4% daily
     *   WBTC  ≈ 55% ann  → ~3.5% daily
     *   LINK  ≈ 90% ann  → ~5.7% daily
     *   UNI   ≈ 95% ann  → ~6.0% daily
     *   DAI   ≈  1% ann  → ~0.06% daily (depeg noise only)
     *   USDC  ≈  0.5%    → ~0.03% daily
     *
     * Step vol = dailyVol / sqrt(stepsPerDay):
     *   24H hourly  → / sqrt(24)  ≈ / 4.9
     *   7D  6-hourly → / sqrt(4)   = / 2
     *   30D daily    → / sqrt(1)   = daily
     */
    var T = {
      '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2': { b: 3247.82,  s: 10,  dv: 0.044 }, /* WETH  */
      '0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599': { b: 67420.00, s: 20,  dv: 0.035 }, /* WBTC  */
      '0x514910771AF9Ca656af840dff83E8264EcF986CA': { b: 14.23,    s: 30,  dv: 0.057 }, /* LINK  */
      '0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984': { b: 8.20,     s: 40,  dv: 0.060 }, /* UNI   */
      '0x6B175474E89094C44Da98b954EedeAC495271d0F': { b: 1.00,     s: 50,  dv: 0.0006 }, /* DAI  */
      '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48': { b: 1.00,     s: 60,  dv: 0.0003 }, /* USDC */
    };

    var h = {};
    for (var addr in T) {
      var t = T[addr];
      h[addr] = {
        '24H': walk(t.b, 24, 3600000,        t.dv / Math.sqrt(24), t.s),
        '7D':  walk(t.b, 28, 21600000,       t.dv / 2,             t.s + 100),
        '30D': walk(t.b, 30, 86400000,       t.dv,                 t.s + 200),
      };
    }
    return h;
  }());

  /* Seed STATE.priceHistory — Phase 7B overwrites per address/tf */
  (function () {
    var h = (window.STATE && STATE.priceHistory) || {};
    for (var addr in MOCK_PRICE_HISTORY) {
      if (!h[addr]) h[addr] = MOCK_PRICE_HISTORY[addr];
    }
    setState({ priceHistory: h });
  }());

  /* ── Formatters ──────────────────────────────────────────────── */
  function fmtP(usd) {
    if (usd === null || usd === undefined) return '\u2014';
    if (usd >= 10000) return '$' + usd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (usd >= 1)     return '$' + usd.toFixed(2);
    return '$' + usd.toFixed(6);
  }

  function fmtTs(ts, tf) {
    var d  = new Date(ts);
    var M  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    var dy = d.getDate();
    var hh = String(d.getHours()).padStart(2, '0');
    var mn = String(d.getMinutes()).padStart(2, '0');
    if (tf === '24H' || tf === '7D') return M + '\u2009' + dy + '  ' + hh + ':' + mn;
    return M + '\u2009' + dy + ',\u2009' + d.getFullYear();
  }

  /* ── Easing ──────────────────────────────────────────────────── */
  function easeOut(p) { return 1 - Math.pow(1 - p, 3); }

  /* ── CSS-var color cache ─────────────────────────────────────────
   * Parse --em, --br, --dim from :root once. Canvas can't use CSS vars.
   * Avoids repeated getComputedStyle calls on every draw frame.
   * ─────────────────────────────────────────────────────────────── */
  var _C = null;
  function C() {
    if (_C) return _C;
    var s = getComputedStyle(document.documentElement);
    function hex(v) {
      v = v.trim();
      if (!v || v[0] !== '#') return [156, 61, 187]; /* --em fallback */
      var n = parseInt(v.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    _C = {
      em:  hex(s.getPropertyValue('--em')  || '#9C3DBB'), /* violet         */
      br:  hex(s.getPropertyValue('--br')  || '#DEE4F4'), /* bright text    */
    };
    return _C;
  }

  /* ── renderChart — inject HTML into .token-panel-chart-slot ─────── */
  function renderChart(slot, address, tf) {
    slot.innerHTML =
      '<div class="chart-section">'
      +   '<div class="chart-toggles">'
      +     '<div class="chart-toggle-indicator"></div>'
      +     '<button class="chart-toggle-btn active" data-tf="24H">24H</button>'
      +     '<button class="chart-toggle-btn" data-tf="7D">7D</button>'
      +     '<button class="chart-toggle-btn" data-tf="30D">30D</button>'
      +   '</div>'
      +   '<div class="chart-wrap"><canvas class="chart-canvas"></canvas></div>'
      + '</div>';

    var indicator = slot.querySelector('.chart-toggle-indicator');
    var btns      = Array.from(slot.querySelectorAll('.chart-toggle-btn'));
    var activeTf  = tf;

    /* Slide indicator under btn */
    function posInd(btn) {
      indicator.style.left  = btn.offsetLeft  + 'px';
      indicator.style.width = btn.offsetWidth + 'px';
    }

    /* Wire toggles */
    btns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        btns.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        activeTf = btn.dataset.tf;
        posInd(btn);
        mountChart(slot, address, activeTf);
      });
    });

    /* Wait for layout before sizing canvas */
    requestAnimationFrame(function () {
      posInd(slot.querySelector('.chart-toggle-btn.active'));
      mountChart(slot, address, activeTf);
    });
  }

  /* ── mountChart — size, draw, wire events ────────────────────── */
  function mountChart(slot, address, tf) {
    var wrap = slot.querySelector('.chart-wrap');
    if (!wrap) return;

    /* Replace canvas with fresh clone — removes ALL prior event listeners.
     * This is the correct pattern for toggle re-renders. */
    var old = wrap.querySelector('.chart-canvas');
    var cv  = old ? old.cloneNode(false) : document.createElement('canvas');
    cv.className = 'chart-canvas';
    if (old) wrap.replaceChild(cv, old);
    else     wrap.appendChild(cv);

    /* DPR-aware sizing */
    var dpr = window.devicePixelRatio || 1;
    var W   = wrap.clientWidth  || 400;
    var H   = wrap.clientHeight || 220;

    cv.width  = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width  = W + 'px';
    cv.style.height = H + 'px';

    var ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);

    /* ── Data ──────────────────────────────────────────────────── */
    var raw = (window.STATE &&
               STATE.priceHistory &&
               STATE.priceHistory[address] &&
               STATE.priceHistory[address][tf] &&
               STATE.priceHistory[address][tf].prices) || [];

    var points = raw
      .filter(function (p) { return Array.isArray(p) && p.length >= 2 && typeof p[1] === 'number'; })
      .map(function (p)    { return { ts: p[0], val: p[1] }; })
      .sort(function (a, b){ return a.ts - b.ts; });

    /* ── Coordinate space ───────────────────────────────────────── */
    /* padR leaves room for the Y-axis labels aligned to the right edge */
    var padL = 0, padR = 76, padT = 18, padB = 10;
    var cW   = W - padL - padR;
    var cH   = H - padT - padB;

    var minVal = 0, maxVal = 1;
    if (points.length) {
      minVal = Math.min.apply(null, points.map(function (p) { return p.val; }));
      maxVal = Math.max.apply(null, points.map(function (p) { return p.val; }));
      var mid  = (minVal + maxVal) / 2;
      var rng  = maxVal - minVal;

      /* Minimum visible range: 1.2% of mid-price.
       * Ensures a 0.1% move in a quiet period doesn't fill the full chart.
       * A 5% move in WBTC will fill the chart; a 0.1% move shows as a thin line.
       * Stablecoins will appear nearly flat — correct behaviour. */
      var minRng = mid * 0.012;
      if (rng < minRng) {
        minVal = mid - minRng / 2;
        maxVal = mid + minRng / 2;
        rng    = minRng;
      }

      /* Breathing room — 10% padding top and bottom */
      var pad = rng * 0.10;
      minVal -= pad;
      maxVal += pad;
    }

    var tsMin  = points.length ? points[0].ts                    : 0;
    var tsMax  = points.length ? points[points.length - 1].ts    : 1;
    var tSpan  = Math.max(tsMax - tsMin, 1);
    var valSpan = Math.max(maxVal - minVal, 0.000001);

    function toX(ts)  { return padL + ((ts  - tsMin) / tSpan)   * cW; }
    function toY(val) { return padT + cH - ((val - minVal) / valSpan) * cH; }

    /* Find nearest data point to an X position (CSS px) */
    function nearest(x) {
      var best = null, bd = Infinity;
      for (var i = 0; i < points.length; i++) {
        var d = Math.abs(toX(points[i].ts) - x);
        if (d < bd) { bd = d; best = points[i]; }
      }
      return best;
    }

    /* ── Design system colors ────────────────────────────────────
     * Resolved once via C(). Canvas can't read CSS variables directly.
     */
    var col = C();
    var er  = col.em[0], eg = col.em[1], eb = col.em[2]; /* #9C3DBB */
    var brr = col.br[0], brg = col.br[1], brb = col.br[2]; /* #DEE4F4 */

    /* ── Core draw function ──────────────────────────────────────
     * clipPct [0..1] — left-to-right draw-in sweep
     * xhair   null | { cx, cy }  — active crosshair position
     * ─────────────────────────────────────────────────────────── */
    function draw(clipPct, xhair) {
      ctx.clearRect(0, 0, W, H);

      /* No data state */
      if (!points.length) {
        ctx.font      = "9px 'Electrolize'";
        ctx.fillStyle = 'rgba(' + er + ',' + eg + ',' + eb + ',.20)';
        ctx.textAlign = 'center';
        ctx.fillText('NO DATA', W / 2, H / 2);
        return;
      }

      /* Y-axis: high / low labels — right-aligned, outside chart area */
      ctx.font      = "9px 'Electrolize'";
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(' + brr + ',' + brg + ',' + brb + ',.26)';
      ctx.fillText(fmtP(maxVal), W - 2, padT + 7);
      ctx.fillStyle = 'rgba(' + brr + ',' + brg + ',' + brb + ',.16)';
      ctx.fillText(fmtP(minVal), W - 2, padT + cH - 2);

      /* Clip region — draw-in animation sweeps left → right */
      ctx.save();
      if (clipPct < 1) {
        ctx.beginPath();
        ctx.rect(0, 0, padL + cW * clipPct + 12, H);
        ctx.clip();
      }

      /* Gradient fill below the line */
      var grd = ctx.createLinearGradient(0, padT, 0, padT + cH);
      grd.addColorStop(0, 'rgba(' + er + ',' + eg + ',' + eb + ',.13)');
      grd.addColorStop(1, 'rgba(' + er + ',' + eg + ',' + eb + ',0)');

      if (points.length >= 2) {
        ctx.beginPath();
        ctx.moveTo(toX(points[0].ts), toY(points[0].val));
        for (var i = 1; i < points.length; i++) {
          var x0 = toX(points[i-1].ts), y0 = toY(points[i-1].val);
          var x1 = toX(points[i].ts),   y1 = toY(points[i].val);
          ctx.bezierCurveTo((x0+x1)/2, y0, (x0+x1)/2, y1, x1, y1);
        }
        ctx.lineTo(toX(points[points.length-1].ts), padT + cH);
        ctx.lineTo(toX(points[0].ts),               padT + cH);
        ctx.closePath();
        ctx.fillStyle = grd;
        ctx.fill();
      }

      /* Glowing line — 1.5px violet per spec */
      ctx.shadowColor = 'rgba(' + er + ',' + eg + ',' + eb + ',.60)';
      ctx.shadowBlur  = 6;
      ctx.strokeStyle = 'rgba(' + er + ',' + eg + ',' + eb + ',.90)';
      ctx.lineWidth   = 1.5;
      ctx.lineJoin    = 'round';
      ctx.lineCap     = 'round';
      ctx.beginPath();
      ctx.moveTo(toX(points[0].ts), toY(points[0].val));
      for (var j = 1; j < points.length; j++) {
        var ax0 = toX(points[j-1].ts), ay0 = toY(points[j-1].val);
        var ax1 = toX(points[j].ts),   ay1 = toY(points[j].val);
        ctx.bezierCurveTo((ax0+ax1)/2, ay0, (ax0+ax1)/2, ay1, ax1, ay1);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();

      /* Terminal dot — visible after animation, hidden during crosshair */
      if (clipPct >= 1 && !xhair) {
        var lx = toX(points[points.length-1].ts);
        var ly = toY(points[points.length-1].val);
        ctx.beginPath();
        ctx.arc(lx, ly, 3, 0, Math.PI * 2);
        ctx.fillStyle   = 'rgba(' + er + ',' + eg + ',' + eb + ',.95)';
        ctx.shadowColor = 'rgba(' + er + ',' + eg + ',' + eb + ',1)';
        ctx.shadowBlur  = 12;
        ctx.fill();
        ctx.shadowBlur  = 0;
      }

      /* Crosshair — vertical + horizontal dashed lines, intersection dot */
      if (xhair) {
        var cx = xhair.cx, cy = xhair.cy;

        /* Vertical dashed */
        ctx.setLineDash([3, 4]);
        ctx.strokeStyle = 'rgba(' + brr + ',' + brg + ',' + brb + ',.10)';
        ctx.lineWidth   = 1;
        ctx.beginPath(); ctx.moveTo(cx, padT); ctx.lineTo(cx, padT + cH); ctx.stroke();

        /* Horizontal dashed */
        ctx.beginPath(); ctx.moveTo(padL, cy); ctx.lineTo(W - padR, cy); ctx.stroke();
        ctx.setLineDash([]);

        /* Intersection dot */
        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, Math.PI * 2);
        ctx.fillStyle   = 'rgba(' + er + ',' + eg + ',' + eb + ',1)';
        ctx.shadowColor = 'rgba(' + er + ',' + eg + ',' + eb + ',1)';
        ctx.shadowBlur  = 14;
        ctx.fill();
        ctx.shadowBlur  = 0;

        /* Outer ring */
        ctx.beginPath();
        ctx.arc(cx, cy, 7.5, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(' + er + ',' + eg + ',' + eb + ',.28)';
        ctx.lineWidth   = 1;
        ctx.stroke();
      }
    }

    /* ── Crosshair interaction ────────────────────────────────────
     * onMove: snap to nearest point, update price display + change row.
     * onLeave: restore original price display + change row.
     *
     * Production pattern: the main .token-panel-usd shows the hovered
     * historical price. The .token-panel-change row is temporarily
     * replaced with the point's formatted timestamp.
     * ─────────────────────────────────────────────────────────── */
    var panel    = slot.closest('.token-panel');
    var priceEl  = panel && panel.querySelector('.token-panel-usd');
    var changeEl = panel && panel.querySelector('.token-panel-change');

    /* Saved originals for restore */
    var _price  = null;
    var _change = null;
    var _class  = null;

    function onMove(e) {
      if (!cv._animDone) return;
      var touch  = e.touches ? e.touches[0] : e;
      var rect   = cv.getBoundingClientRect();
      var x      = touch.clientX - rect.left;

      var pt = nearest(x);
      if (!pt) return;

      draw(1, { cx: toX(pt.ts), cy: toY(pt.val) });

      /* Update price display — store original on first entry */
      if (priceEl) {
        if (_price === null) _price = priceEl.textContent;
        priceEl.textContent = fmtP(pt.val);
      }

      /* Replace change row with timestamp */
      if (changeEl) {
        if (_change === null) {
          _change = changeEl.innerHTML;
          _class  = changeEl.className;
        }
        changeEl.className = 'token-panel-change';
        changeEl.innerHTML =
          '<span class="token-panel-change-period"'
          + ' style="font-size:.76rem;letter-spacing:.06em;color:var(--bd)">'
          + fmtTs(pt.ts, tf)
          + '</span>';
      }
    }

    function onLeave() {
      if (!cv._animDone) return;
      draw(1, null);

      /* Restore price */
      if (priceEl && _price !== null) {
        priceEl.textContent = _price;
        _price = null;
      }

      /* Restore change row */
      if (changeEl && _change !== null) {
        changeEl.innerHTML = _change;
        changeEl.className = _class;
        _change = null;
        _class  = null;
      }
    }

    /* Desktop */
    cv.addEventListener('mousemove',  onMove);
    cv.addEventListener('mouseleave', onLeave);

    /* Mobile touch — passive:false to allow preventDefault */
    cv.addEventListener('touchstart', function (e) { e.preventDefault(); onMove(e);  }, { passive: false });
    cv.addEventListener('touchmove',  function (e) { e.preventDefault(); onMove(e);  }, { passive: false });
    cv.addEventListener('touchend',   function (e) { e.preventDefault(); onLeave();  }, { passive: false });

    /* ── Draw-in animation — 600ms ease-out per spec ─────────────
     * Clips canvas left→right. Terminal dot appears when done.
     * Crosshair is disabled (cv._animDone = false) during animation.
     * ─────────────────────────────────────────────────────────── */
    cv._animDone = false;
    var t0  = performance.now();
    var DUR = 600;

    function frame(now) {
      var p = Math.min(1, (now - t0) / DUR);
      draw(easeOut(p), null);
      if (p < 1) {
        requestAnimationFrame(frame);
      } else {
        cv._animDone = true;
        /* Guarantee terminal dot render on final frame */
        draw(1, null);
      }
    }
    requestAnimationFrame(frame);
  }

  /* ── DOM containers (same elements as Phase 4A) ─────────────── */
  var rightContent    = document.getElementById('right-panel-content');
  var mobileTokenView = document.getElementById('mobile-token');

  /* Try to mount chart into the slot that Phase 4A just injected.
   * RAF ensures layout is complete before we read clientWidth/Height. */
  function tryMount(container, address, tf) {
    requestAnimationFrame(function () {
      var slot = container.querySelector('.token-panel-chart-slot');
      if (slot && address) renderChart(slot, address, tf || '24H');
    });
  }

  /* ── State event listeners ───────────────────────────────────── */

  /* panel:render — dispatched by 2C after 160ms fade-out.
   * Phase 4A (registered first) injects .token-panel synchronously,
   * then this fires. RAF in tryMount waits for layout. */
  document.addEventListener('panel:render', function (e) {
    if (e.detail !== 'token') return;
    tryMount(rightContent, window.STATE && STATE.token, '24H');
  });

  /* Mobile view becomes token */
  document.addEventListener('state:mobileView', function (e) {
    if (e.detail !== 'token') return;
    tryMount(mobileTokenView, window.STATE && STATE.token, '24H');
  });

  /* Token address changes while panel is visible — re-render chart */
  document.addEventListener('state:token', function (e) {
    var address = e.detail;
    if (window.STATE && STATE.rightPanel === 'token') tryMount(rightContent,    address, '24H');
    if (window.STATE && STATE.mobileView === 'token') tryMount(mobileTokenView, address, '24H');
  });

  /* Phase 7B hook — fires when priceHistory entry is loaded/refreshed.
   * Re-mounts the chart for the currently-viewed token + active timeframe. */
  document.addEventListener('state:priceHistory', function () {
    var address = window.STATE && STATE.token;
    if (!address) return;
    if (STATE.rightPanel === 'token') {
      var slot = rightContent.querySelector('.token-panel-chart-slot');
      var btn  = slot && slot.querySelector('.chart-toggle-btn.active');
      if (slot) mountChart(slot, address, btn ? btn.dataset.tf : '24H');
    }
    if (STATE.mobileView === 'token') {
      var mslot = mobileTokenView.querySelector('.token-panel-chart-slot');
      var mbtn  = mslot && mslot.querySelector('.chart-toggle-btn.active');
      if (mslot) mountChart(mslot, address, mbtn ? mbtn.dataset.tf : '24H');
    }
  });

}());
</script>

<!-- ── Phase 4A — Token Panel: Header + Price Display ───────────── -->
<script>
(function () {
  'use strict';

  /*
   * ARCHITECTURE
   * ─────────────────────────────────────────────────────────────────
   * Desktop: panel:render fires (dispatched by 2C's renderPanelContent
   *          after the 160ms fade) → renderDesktop() injects .token-panel
   *          into #right-panel-content alongside the always-present
   *          #panel-null (which 2C hides/shows via .hidden attribute).
   *          Never clobber rightContent.innerHTML — that would destroy panelNull.
   *
   * Mobile:  state:mobileView fires → renderMobile() injects .token-panel
   *          into #mobile-token (safe to innerHTML = '' — no shared nodes).
   *
   * state:token   → re-render whichever side is active.
   * state:prices  → updatePriceInContainer() — only the price span + change
   *                 row; rest of panel untouched. Hook for Phase 7A.
   *
   * window.updatePrice exported — Phase 7A calls it on token row spans too.
   * ─────────────────────────────────────────────────────────────────
   */

  /* ── Containers ──────────────────────────────────────────────── */
  var rightContent    = document.getElementById('right-panel-content');
  var mobileTokenView = document.getElementById('mobile-token');

  /* ── Formatters ──────────────────────────────────────────────── */
  function getLogoUrl(address) {
    var cs = address;
    try { cs = ethers.utils.getAddress(address); } catch (_) {}
    return 'https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/ethereum/assets/'
      + cs + '/logo.png';
  }

  function formatPrice(usd) {
    if (usd === null || usd === undefined) return '\u2014';
    if (usd >= 10000) return '$' + usd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (usd >= 1)     return '$' + usd.toFixed(2);
    return '$' + usd.toFixed(4);
  }

  function formatChange(change) {
    if (change === null || change === undefined) return '\u2014';
    return (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
  }

  function formatDelta(usd, change) {
    if (!usd || change === null || change === undefined) return '';
    var d = usd * change / 100;
    return (d >= 0 ? '+$' : '\u2212$') + Math.abs(d).toFixed(2);
  }

  /* ── updatePrice — exported to window for Phase 7A ──────────── */
  /*
   * Fade price span out (80ms ease-in) → swap value + flash color
   * → fade in (120ms ease-out) → color bleeds back to default (600ms).
   * el     — any .token-panel-usd or .token-row-usd element
   * newVal — new price as number
   * oldVal — previous price as number (drives green/red flash)
   */
  window.updatePrice = function (el, newVal, oldVal) {
    el.style.transition = 'opacity 80ms var(--ease-in)';
    el.style.opacity    = '0';
    setTimeout(function () {
      el.textContent      = formatPrice(newVal);
      el.style.color      = newVal > oldVal ? 'var(--up)' : 'var(--dn)';
      el.style.opacity    = '1';
      el.style.transition = 'opacity 120ms var(--ease-out), color 600ms var(--ease-std)';
      setTimeout(function () { el.style.color = ''; }, 600);
    }, 80);
  };

  /* ── STATE helpers ───────────────────────────────────────────── */
  function getToken(address) {
    if (!window.STATE || !STATE.tokenList) return null;
    for (var i = 0; i < STATE.tokenList.length; i++) {
      if (STATE.tokenList[i].address === address) return STATE.tokenList[i];
    }
    return null;
  }

  function getPrice(address) {
    if (!window.STATE || !STATE.prices) return null;
    return STATE.prices[address] || null;
  }

  /* ── Skeleton ────────────────────────────────────────────────── */
  function buildSkeleton() {
    var el = document.createElement('div');
    el.className = 'token-panel';
    el.innerHTML =
      '<div class="token-panel-header">'
      +   '<div class="skeleton tp-skel-logo"></div>'
      +   '<div class="token-panel-identity">'
      +     '<div class="skeleton tp-skel-name"></div>'
      +     '<div class="skeleton tp-skel-sym"></div>'
      +   '</div>'
      + '</div>'
      + '<div class="token-panel-price">'
      +   '<div class="skeleton tp-skel-price"></div>'
      +   '<div class="skeleton tp-skel-change"></div>'
      + '</div>'
      + '<div class="token-panel-chart-slot"></div>';
    return el;
  }

  /* ── Loaded panel ────────────────────────────────────────────── */
  function buildPanel(token, price) {
    var el       = document.createElement('div');
    el.className = 'token-panel';
    el.setAttribute('data-token', token.address);

    var usd         = price ? price.usd       : null;
    var change      = price ? price.change24h : null;
    var changeClass = change > 0 ? 'up' : change < 0 ? 'dn' : '';

    el.innerHTML =
      '<div class="token-panel-header">'
      +   '<img class="token-panel-logo"'
      +       ' src="' + getLogoUrl(token.address) + '"'
      +       ' alt="' + token.symbol + '"'
      +       ' width="40" height="40">'
      +   '<div class="token-logo-fallback-lg" style="display:none">'
      +     token.symbol[0]
      +   '</div>'
      +   '<div class="token-panel-identity">'
      +     '<span class="token-panel-name">'   + token.name   + '</span>'
      +     '<span class="token-panel-symbol">' + token.symbol + '</span>'
      +   '</div>'
      + '</div>'
      + '<div class="token-panel-price">'
      +   '<span class="token-panel-usd">'
      +     (usd !== null ? formatPrice(usd) : '\u2014')
      +   '</span>'
      +   '<div class="token-panel-change ' + changeClass + '">'
      +     '<span class="token-panel-change-delta">'
      +       (price ? formatDelta(usd, change) : '')
      +     '</span>'
      +     '<span class="token-panel-change-pct">'
      +       (price ? formatChange(change) : '')
      +     '</span>'
      +     '<span class="token-panel-change-period">24h</span>'
      +   '</div>'
      + '</div>'
      + '<div class="token-panel-chart-slot"><!-- 4B: canvas + time toggles --></div>';

    /* Logo fallback — hide img, show initial circle on error */
    var img      = el.querySelector('.token-panel-logo');
    var fallback = el.querySelector('.token-logo-fallback-lg');
    img.onerror  = function () {
      img.style.display      = 'none';
      fallback.style.display = 'flex';
    };

    return el;
  }

  /* ── Inject / replace in a container ────────────────────────── */
  /*
   * Desktop: removes old .token-panel, appends new one.
   *          #panel-null stays in the DOM — 2C's renderPanelContent
   *          controls its .hidden attribute independently.
   * Mobile:  innerHTML = '' is safe since #mobile-token owns nothing else.
   */
  function injectDesktop(address) {
    var old = rightContent.querySelector('.token-panel');
    if (old) rightContent.removeChild(old);
    if (!address) return;           /* null: panel-null already shown by 2C */
    var token = getToken(address);
    rightContent.appendChild(token ? buildPanel(token, getPrice(address)) : buildSkeleton());
  }

  function injectMobile(address) {
    mobileTokenView.innerHTML = '';
    var token = address ? getToken(address) : null;
    mobileTokenView.appendChild(token ? buildPanel(token, getPrice(address)) : buildSkeleton());
  }

  /* ── Live price update — container-scoped, no full re-render ─── */
  /*
   * Touches only the price span and change row.
   * Rest of the panel (header, chart slot) is untouched.
   * Called by state:prices — Phase 7A will drive this on every block.
   */
  function updatePriceInContainer(container, price) {
    var priceEl  = container.querySelector('.token-panel-usd');
    var changeEl = container.querySelector('.token-panel-change');
    var deltaEl  = container.querySelector('.token-panel-change-delta');
    var pctEl    = container.querySelector('.token-panel-change-pct');
    if (!priceEl) return;

    var oldVal = parseFloat(priceEl.textContent.replace(/[^0-9.]/g, '')) || 0;
    window.updatePrice(priceEl, price.usd, oldVal);

    if (changeEl) {
      changeEl.className = 'token-panel-change '
        + (price.change24h > 0 ? 'up' : price.change24h < 0 ? 'dn' : '');
    }
    if (deltaEl) deltaEl.textContent = formatDelta(price.usd,  price.change24h);
    if (pctEl)   pctEl.textContent   = formatChange(price.change24h);
  }

  /* ── State event listeners ───────────────────────────────────── */

  /*
   * panel:render — dispatched by 2C's renderPanelContent after the
   * 160ms fade out. Fires for EVERY right-panel state, so guard on 'token'.
   * For any other state (null / swap / history): clean up any leftover panel.
   */
  document.addEventListener('panel:render', function (e) {
    if (e.detail === 'token') {
      injectDesktop(window.STATE && STATE.token);
    } else {
      /* Remove token panel when switching away — panel-null takes over */
      var old = rightContent.querySelector('.token-panel');
      if (old) rightContent.removeChild(old);
    }
  });

  /*
   * state:mobileView — 2C shows/hides mobile views on this event.
   * 4A renders the token panel into #mobile-token when it becomes active.
   */
  document.addEventListener('state:mobileView', function (e) {
    if (e.detail !== 'token') return;
    injectMobile(window.STATE && STATE.token);
  });

  /*
   * state:token — address changed while a panel is already visible.
   * Re-render the active side(s) immediately (no fade — 2C's fade only
   * runs on rightPanel state changes, not token changes).
   */
  document.addEventListener('state:token', function (e) {
    var address = e.detail;
    if (window.STATE && STATE.rightPanel === 'token') injectDesktop(address);
    if (window.STATE && STATE.mobileView === 'token') injectMobile(address);
  });

  /*
   * state:prices — Phase 7A hook. Fires on every Chainlink block update.
   * Updates the price span + change row in whichever panel is visible.
   * Does NOT re-render the full panel — header and chart slot are stable.
   */
  document.addEventListener('state:prices', function () {
    var address = window.STATE && STATE.token;
    if (!address) return;
    var price = getPrice(address);
    if (!price) return;
    if (STATE.rightPanel === 'token') updatePriceInContainer(rightContent,    price);
    if (STATE.mobileView === 'token') updatePriceInContainer(mobileTokenView, price);
  });

}());
</script>

</body>
