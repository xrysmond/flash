<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBSIDEUM</title>
  <link rel="stylesheet" href="core.css">
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    /* ── Canvas — always behind, fixed, full screen ── */
    #crystal-canvas,
    #particle-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Desktop grid ── */
    .app-desktop {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 220px 1fr;
      grid-template-rows: var(--app-h, 100svh);
      height: var(--app-h, 100svh);
      overflow: hidden;
    }

    .content-area {
      display: grid;
      grid-template-columns: 360px 1fr;
      overflow: hidden;
    }

    .markets-layout { display: contents; }

    .token-list-col {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--trace);
    }

    .token-list { flex: 1; overflow-y: auto; }

    .right-panel { overflow: hidden; min-width: 360px; }

    .settings-layout {
      grid-column: 1 / -1;
      overflow-y: auto;
    }

    /* ── Sidebar shell ── */
    .sidebar {
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    /* ── Sidebar — mobile-pill depth applied to the vertical panel ── */
    #sidebar {
      background: rgba(7,7,9,.92);
      -webkit-backdrop-filter: blur(28px) saturate(160%) brightness(.96);
      backdrop-filter: blur(28px) saturate(160%) brightness(.96);
      border: none;
      border-right: 1px solid rgba(156,61,187,.22);
      box-shadow:
        0 0 0 0.5px rgba(156,61,187,.10),
        inset -1px 0 0 rgba(190,128,220,.08),
        6px 0 32px -4px  rgba(0,0,0,.60),
        20px 0 60px -12px rgba(0,0,0,.80);
    }

    .sidebar-wordmark {
      font-family: var(--fd);
      font-weight: 400;
      font-size: .92rem;
      letter-spacing: .20em;
      color: var(--br);
      padding: var(--sp-4) var(--sp-3) var(--sp-5);
    }

    /* ── Sidebar nav ── */
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: relative;
    }

    .sidebar-nav-indicator {
      position: absolute;
      left: 0;
      top: 0;
      width: 2px;
      height: 46px;
      background: var(--em-2);
      box-shadow:
        0 0 6px 1px rgba(156,61,187,.70),
        0 0 18px 4px rgba(156,61,187,.30);
      transition:
        transform 450ms var(--ease-spr),
        height    350ms var(--ease-spr);
      pointer-events: none;
      z-index: 10;
    }

    .sidebar-nav .nav-item {
      opacity: .28;
      color: var(--em-2);
      padding: .82rem .75rem;
      transition:
        opacity    200ms var(--ease-std),
        background 140ms var(--ease-std),
        transform  300ms var(--ease-spr);
    }
    .sidebar-nav .nav-item::before { display: none; }
    .sidebar-nav .nav-item.active {
      opacity: 1;
      color: var(--em-2);
      background: transparent;
    }
    .sidebar-nav .nav-item:hover:not(.active) {
      opacity: .55;
      background: transparent;
    }
    .sidebar-nav .nav-item:active {
      transform: scale(.96);
      transition: transform 80ms var(--ease-spr);
    }

    .nav-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
      flex-shrink: 0;
    }

    .nav-label {
      font-family: var(--fm);
      font-size: .64rem;
      letter-spacing: .26em;
      text-transform: uppercase;
      line-height: 1;
    }

    .nav-item--settings {
      border-top: 1px solid var(--trace);
      margin-top: auto;
    }

    /* ── Wallet block ── */
    .sidebar-wallet-block {
      padding: var(--sp-2) var(--sp-3) var(--sp-3);
      border-bottom: 1px solid var(--trace);
    }

    .swb-card {
      background: rgba(156,61,187,.05);
      border: 1px solid rgba(156,61,187,.13);
      box-shadow:
        inset 0 1px 0 rgba(190,128,220,.07),
        inset 0 -1px 0 rgba(0,0,0,.18);
      padding: 9px 10px 8px 12px;
    }

    .swb-top {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 4px;
    }

    .swb-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
      background: rgba(156,61,187,.30);
      transition: background 300ms var(--ease-std), box-shadow 300ms var(--ease-std);
    }
    .swb-dot.connected {
      background: var(--up);
      box-shadow: 0 0 6px 1px rgba(52,211,153,.50);
    }

    #sidebar-wallet {
      font-family: var(--fm);
      font-size: .62rem;
      letter-spacing: .05em;
      color: var(--bd);
      flex: 1;
      min-height: 14px;
      transition: opacity 120ms var(--ease-std);
    }
    #sidebar-wallet:empty::before {
      content: 'no wallet connected';
      color: var(--dim);
      font-size: .58rem;
      letter-spacing: .08em;
      opacity: .50;
    }

    #sidebar-network {
      font-family: var(--fm);
      font-size: .56rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--dim);
      padding-left: 12px;
      min-height: 12px;
      transition: color 140ms var(--ease-std);
    }
    #sidebar-network:empty::before {
      content: '— — —';
      opacity: .22;
    }

    /* ── Button resets ── */
    .nav-item {
      background: transparent;
      border: none;
    }

    .nav-gear { flex-shrink: 0; }

    /* ── Search bar ── */
    .search-wrap {
      padding: var(--sp-3);
      border-bottom: 1px solid var(--trace);
      flex-shrink: 0;
    }

    /* ── Right panel transitions ── */
    .panel-content {
      height: 100%;
      display: flex;
      flex-direction: column;
      transition: opacity 160ms var(--ease-std);
    }

    .panel-content.leaving  { opacity: 0; }

    .panel-content.entering {
      animation: panelIn 240ms var(--ease-std) forwards;
    }

    @keyframes panelIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .panel-null-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel-null-label {
      font-family: var(--fm);
      font-size: .68rem;
      letter-spacing: .44em;
      color: var(--dim);
      text-transform: uppercase;
    }

    /* ── Responsive ── */
    @media (max-width: 767px) {
      .app-desktop { display: none; }
      .app-mobile {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        position: relative;
        z-index: 1;
      }
    }
    @media (min-width: 768px) {
      .app-desktop { display: grid; }
      .app-mobile  { display: none; }
    }

    /* ── Mobile layout ── */
    .mobile-top-bar {
      display: grid;
      grid-template-columns: 80px 1fr 80px;
      align-items: center;
      padding: 0 var(--sp-2);
      height: 56px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(156,61,187,.18);
      background: rgba(7,7,9,.80);
      -webkit-backdrop-filter: blur(24px) saturate(140%) brightness(.97);
      backdrop-filter: blur(24px) saturate(140%) brightness(.97);
    }

    .mobile-content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .mobile-view {
      position: absolute;
      inset: 0;
      overflow-y: auto;
    }

    /* ── Mobile bottom nav — floating glass pill ── */
    .mobile-bottom-nav {
      display: flex;
      height: 62px;
      flex-shrink: 0;
      margin: 0 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
      background: rgba(7,7,9,.92);
      -webkit-backdrop-filter: blur(28px) saturate(160%) brightness(.96);
      backdrop-filter: blur(28px) saturate(160%) brightness(.96);
      border: 1px solid rgba(156,61,187,.22);
      box-shadow:
        0 0 0 0.5px rgba(156,61,187,.12),
        inset 0 1px 0 rgba(190,128,220,.08),
        0 8px 32px -8px rgba(0,0,0,.6),
        0 24px 60px -20px rgba(0,0,0,.85);
      position: relative;
      z-index: 200;
      /* Base transition for reveal — hidden state overrides this */
      transition: opacity 280ms var(--ease-out), transform 300ms var(--ease-spr);
    }

    /* Hidden when drilling into token / history / settings — slides down off-screen */
    .mobile-bottom-nav.nav-hidden {
      opacity: 0;
      transform: translateY(110%);
      pointer-events: none;
      transition: opacity 200ms var(--ease-in), transform 240ms var(--ease-in);
    }

    .mobile-nav-indicator {
      position: absolute;
      top: -1px;
      left: 0;
      height: 2px;
      width: 50%;
      background: var(--em-2);
      box-shadow:
        0 0 6px 1px rgba(156,61,187,.7),
        0 0 18px 4px rgba(156,61,187,.3);
      transition: transform 450ms var(--ease-spr);
      pointer-events: none;
    }

    /* Wordmark — transitions to token symbol or view label when drilling in */
    .mobile-wordmark {
      font-family: var(--fd);
      font-weight: 400;
      font-size: .88rem;
      letter-spacing: .24em;
      color: var(--br);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      text-transform: uppercase;
      transition:
        color        220ms var(--ease-std),
        letter-spacing 220ms var(--ease-std),
        font-size    220ms var(--ease-std);
    }

    /* Context: viewing a token — symbol in --em-2, tighter Electrolize feel */
    .mobile-wordmark.ctx-token {
      font-family: var(--fm);
      font-size: .76rem;
      letter-spacing: .42em;
      color: var(--em-2);
    }

    /* Context: settings / history — dim Electrolize label */
    .mobile-wordmark.ctx-section {
      font-family: var(--fm);
      font-size: .64rem;
      letter-spacing: .48em;
      color: var(--dim);
    }

    /* Back + icon buttons — ghost circles. All UA defaults reset. */
    .mobile-back,
    .mobile-icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--dim);
      cursor: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition:
        color        160ms var(--ease-std),
        border-color 160ms var(--ease-std),
        background   160ms var(--ease-std);
    }

    /* Back: invisible until needed */
    .mobile-back {
      opacity: 0;
      pointer-events: none;
      transition:
        color        160ms var(--ease-std),
        border-color 160ms var(--ease-std),
        background   160ms var(--ease-std),
        opacity      200ms var(--ease-std);
    }
    .mobile-back.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-back:hover,
    .mobile-icon-btn:hover {
      color: var(--em-2);
      border-color: var(--em-lo);
      background: var(--em-tr);
    }
    .mobile-back:active,
    .mobile-icon-btn:active {
      transform: scale(.90);
      background: rgba(156,61,187,.14);
      transition: transform 80ms var(--ease-spr), background 80ms var(--ease-spr);
    }
    .mobile-back:focus-visible,
    .mobile-icon-btn:focus-visible {
      outline: 1.5px solid rgba(156,61,187,.50);
      outline-offset: 2px;
    }

    .mobile-top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
    }

    .mobile-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: transparent;
      border: none;
      opacity: .30;
      padding: 8px 0;
      cursor: none;
      -webkit-user-select: none;
      user-select: none;
      transition: opacity 200ms var(--ease-std), transform 300ms var(--ease-spr);
    }
    .mobile-nav-item:active              { transform: scale(.92); transition: transform 80ms var(--ease-spr); }
    .mobile-nav-item.active              { opacity: 1; }
    .mobile-nav-item:hover:not(.active)  { opacity: .52; }

    .mobile-nav-icon {
      width: 18px;
      height: 18px;
      stroke: var(--em-2);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }

    .mobile-nav-label {
      font-family: var(--fm);
      font-size: 7.5px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--em-2);
      line-height: 1;
    }

    /* ══════════════════════════════════════════════════════════════
       PHASE 3A — TOKEN ROW COMPONENT
       All four states: skeleton / loaded / hover / click navigation
       ══════════════════════════════════════════════════════════════ */

    /* ── Skeleton ── */
    .skeleton {
      background: linear-gradient(
        90deg,
        var(--trace)              0%,
        rgba(156,61,187,.08)     50%,
        var(--trace)             100%
      );
      background-size: 200% 100%;
      animation: skeleton-sweep 1.8s var(--ease-std) infinite;
      border-radius: 2px;
    }
    @keyframes skeleton-sweep {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }
    .token-row--skeleton { pointer-events: none; }

    /* ── Row base ── */
    .token-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      position: relative;
      border-bottom: 1px solid var(--trace);
      cursor: none;
      -webkit-user-select: none;
      user-select: none;
      min-height: 58px;
      transition: background 140ms var(--ease-std);
    }

    /* Left violet accent bar — spring-scales on hover */
    .token-row::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--em);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform 160ms var(--ease-spr);
      pointer-events: none;
    }

    .token-row:hover                 { background: var(--hi); }
    .token-row:hover::before         { transform: scaleY(1); }
    .token-row:active                { background: var(--em-tr); transition: background 80ms var(--ease-spr); }
    .token-row:focus-visible         { outline: 1.5px solid rgba(156,61,187,.50); outline-offset: -1.5px; }

    /* ── Logo ── */
    .token-row-logo {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      position: relative;
    }

    .token-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: block;
      object-fit: cover;
    }

    /* Fallback — first letter of symbol, violet circle */
    .token-logo-fallback {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--em);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--fm);
      font-size: .64rem;
      letter-spacing: 0;
      color: #ffffff;
      flex-shrink: 0;
    }

    /* ── Info column ── */
    .token-row-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .token-row-name {
      font-family: var(--fm);
      font-size: .80rem;
      letter-spacing: .02em;
      color: var(--br);
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .token-row-symbol {
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .18em;
      color: var(--em-2);
      text-transform: uppercase;
      line-height: 1;
    }

    .token-row-chain {
      font-family: var(--fm);
      font-size: .54rem;
      letter-spacing: .22em;
      color: var(--dim);
      text-transform: uppercase;
      line-height: 1;
    }

    /* ── Sparkline placeholder — desktop hover only ── */
    .token-row-sparkline {
      width: 56px;
      height: 24px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 200ms var(--ease-std);
      display: none;             /* hidden on mobile */
    }

    /* Inherit color from sparkline-up / sparkline-dn — SVG uses currentColor */
    .token-row-sparkline.sparkline-up { color: var(--up); }
    .token-row-sparkline.sparkline-dn { color: var(--dn); }

    @media (min-width: 768px) {
      .token-row-sparkline          { display: block; }
    }

    .token-row:hover .token-row-sparkline { opacity: 1; }

    /* ── Price column ── */
    .token-row-price {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      flex-shrink: 0;
    }

    .token-row-usd {
      font-family: var(--fm);
      font-size: .80rem;
      letter-spacing: .02em;
      color: var(--br);
      line-height: 1.1;
      /* updatePrice() drives these transitions in Phase 7A */
      transition: opacity 80ms var(--ease-in), color 600ms var(--ease-std);
    }

    .token-row-change {
      font-family: var(--fm);
      font-size: .62rem;
      letter-spacing: .04em;
      line-height: 1;
    }
    .token-row-change.up                    { color: var(--up); }
    .token-row-change.dn                    { color: var(--dn); }
    .token-row-change:not(.up):not(.dn)     { color: var(--dim); }

    .token-row-volume {
      font-family: var(--fm);
      font-size: .56rem;
      letter-spacing: .06em;
      color: var(--dim);
      line-height: 1;
    }

    /* ── Mobile markets — flex column so search stays fixed, list scrolls ── */
    #mobile-markets {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Token list empty state ── */
    .token-list-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-6);
      min-height: 160px;
    }

    .token-list-empty-label {
      font-family: var(--fm);
      font-size: .68rem;
      letter-spacing: .28em;
      color: var(--dim);
      text-transform: uppercase;
    }

    /* ── Token list error state ── */
    .token-list-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-3);
      padding: var(--sp-6);
      min-height: 160px;
    }

    .token-list-error-label {
      font-family: var(--fm);
      font-size: .68rem;
      letter-spacing: .22em;
      color: var(--dn);
      text-transform: uppercase;
    }

    .token-list-retry {
      background: transparent;
      border: 1px solid var(--trace);
      color: var(--dim);
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .24em;
      text-transform: uppercase;
      padding: 6px 14px;
      cursor: none;
      transition:
        border-color 120ms var(--ease-std),
        color        120ms var(--ease-std);
    }
    .token-list-retry:hover {
      border-color: var(--em-lo);
      color: var(--em-2);
    }

    /* ══════════════════════════════════════════════════════════════
       PHASE 4A — TOKEN PANEL: HEADER + PRICE DISPLAY
       Desktop: fills right-panel-content via flex:1, scrolls internally.
       Mobile:  natural height inside mobile-token (position:absolute scroll).
       ══════════════════════════════════════════════════════════════ */

    .token-panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: var(--sp-5) var(--sp-5) var(--sp-6);
    }

    @media (max-width: 767px) {
      .token-panel { padding: var(--sp-4) var(--sp-3) var(--sp-5); }
    }

    /* Header row — logo + identity */
    .token-panel-header {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      margin-bottom: var(--sp-4);
      flex-shrink: 0;
    }

    .token-panel-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      display: block;
      object-fit: cover;
    }

    /* Fallback — first letter of symbol, violet circle, 40px */
    .token-logo-fallback-lg {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--em);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--fm);
      font-size: .88rem;
      letter-spacing: 0;
      color: #ffffff;
      flex-shrink: 0;
    }

    .token-panel-identity {
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
      min-width: 0;
    }

    /* Cinzel display — 1.6rem, .08em tracking per typography scale */
    .token-panel-name {
      font-family: var(--fd);
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: .08em;
      color: var(--br);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Eyebrow — .72rem Electrolize 300, .52em tracking, uppercase */
    .token-panel-symbol {
      font-family: var(--fm);
      font-size: .72rem;
      font-weight: 300;
      letter-spacing: .52em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1;
    }

    /* Price block */
    .token-panel-price {
      margin-bottom: var(--sp-5);
      flex-shrink: 0;
    }

    /* Large live price — 2.2rem Electrolize, color driven by updatePrice() */
    .token-panel-usd {
      display: block;
      font-family: var(--fm);
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: .02em;
      color: var(--br);
      line-height: 1;
      margin-bottom: var(--sp-2);
    }

    /* 24h change row — delta + pct + period label */
    .token-panel-change {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      font-family: var(--fm);
      font-size: .82rem;
      font-weight: 300;
      letter-spacing: .04em;
      line-height: 1;
    }

    .token-panel-change.up { color: var(--up); }
    .token-panel-change.dn { color: var(--dn); }

    /* "24h" eyebrow label — inherits color from parent, shifted dimmer */
    .token-panel-change-period {
      font-family: var(--fm);
      font-size: .64rem;
      font-weight: 300;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--dim);
      margin-left: var(--sp-1);
    }

    /* Chart slot — fixed height on all breakpoints.
     * The chart is always exactly 224px, proportionally contained.
     * Phase 4C content (stat cells, swap) lives below and scrolls naturally. */
    .token-panel-chart-slot {
      flex-shrink: 0;
      height: 224px;
    }

    /* Skeleton geometry — all use .skeleton from above for animation */
    .tp-skel-logo   { width: 40px;  height: 40px;  border-radius: 50%;  }
    .tp-skel-name   { width: 140px; height: 22px;  margin-bottom: 6px;  }
    .tp-skel-sym    { width: 56px;  height: 10px;  }
    .tp-skel-price  { width: 180px; height: 34px;  margin-bottom: 10px; }
    .tp-skel-change { width: 120px; height: 13px;  }

    /* Crosshair hover — smooth color transition on price update */
    .token-panel-usd { transition: color 80ms var(--ease-std); }

    /* ══════════════════════════════════════════════════════════════
       PHASE 4B — PRICE CHART
       Canvas line chart. Draw-in 600ms ease-out. Crosshair snaps to
       nearest data point on hover/touch — updates the main price
       display and replaces the change row with the timestamp.
       Exact Uniswap / Coinbase interaction pattern.
       ══════════════════════════════════════════════════════════════ */

    .chart-section {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .chart-toggles {
      display: flex;
      position: relative;
      padding-bottom: 1px;
      margin-bottom: var(--sp-3);
      flex-shrink: 0;
    }

    .chart-toggle-indicator {
      position: absolute;
      bottom: 0;
      height: 1.5px;
      background: var(--em);
      box-shadow:
        0 0 6px 1px rgba(156,61,187,.55),
        0 0 14px 3px rgba(156,61,187,.22);
      pointer-events: none;
      transition: left 220ms var(--ease-spr), width 220ms var(--ease-spr);
    }

    /* All UA defaults explicitly reset */
    .chart-toggle-btn {
      font-family: var(--fm);
      font-size: .64rem;
      font-weight: 300;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--dim);
      background: transparent;
      border: none;
      padding: var(--sp-1) var(--sp-3) var(--sp-2);
      cursor: none;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      line-height: 1;
      transition: color 200ms var(--ease-std);
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .chart-toggle-btn.active             { color: var(--em-2); }
    .chart-toggle-btn:hover:not(.active) { color: var(--bd); }
    .chart-toggle-btn:active             { transform: scale(.94); transition: transform 80ms var(--ease-spr); }
    .chart-toggle-btn:focus-visible      { outline: 1.5px solid rgba(156,61,187,.50); outline-offset: 2px; }

    /* Fills remaining chart-slot space */
    .chart-wrap {
      position: relative;
      flex: 1;
      min-height: 0;        /* desktop: bounded by the flex parent — no unconstrained growth */
    }

    .chart-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

  </style>
</head>

<script>
  function showToast(message, type) {
    var wrap = document.getElementById('toast-wrap');
    if (!wrap) return;
    var el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    el.textContent = message;
    wrap.appendChild(el);
    setTimeout(function () {
      el.style.transition = 'opacity 300ms var(--ease-std)';
      el.style.opacity = '0';
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
    }, 3200);
  }

  FX.init(document.getElementById('crystal-canvas'), document.getElementById('particle-canvas'));
  FX.start();
  checkExistingConnection();
</script>

<!-- ── Phase 2C — Navigation wiring ─────────────────────────────── -->
<script>
(function () {
  'use strict';

  var marketsLayout  = document.getElementById('markets-layout');
  var settingsLayout = document.getElementById('settings-layout');
  var rightContent   = document.getElementById('right-panel-content');
  var panelNull      = document.getElementById('panel-null');
  var mobileBack     = document.getElementById('mobile-back');
  var sidebarWallet  = document.getElementById('sidebar-wallet');
  var sidebarNetwork = document.getElementById('sidebar-network');

  var mobileViews = {
    markets:  document.getElementById('mobile-markets'),
    token:    document.getElementById('mobile-token'),
    swap:     document.getElementById('mobile-swap'),
    history:  document.getElementById('mobile-history'),
    settings: document.getElementById('mobile-settings'),
  };

  var NETWORK_NAMES = {
    1: 'Ethereum', 42161: 'Arbitrum One', 8453: 'Base', 10: 'Optimism',
  };

  function renderPanelContent(state) {
    panelNull.hidden = (state !== null);
    document.dispatchEvent(new CustomEvent('panel:render', { detail: state }));
  }

  function setRightPanel(state) {
    rightContent.classList.add('leaving');
    setTimeout(function () {
      renderPanelContent(state);
      rightContent.classList.remove('leaving');
      void rightContent.offsetWidth;
      rightContent.classList.add('entering');
      setTimeout(function () { rightContent.classList.remove('entering'); }, 240);
    }, 160);
  }

  function setView(view) {
    if (view === 'settings') {
      marketsLayout.style.display = 'none';
      settingsLayout.hidden = false;
    } else {
      marketsLayout.style.display = '';
      settingsLayout.hidden = true;
    }
    updateSidebarActive();
  }

  function updateSidebarActive() {
    var view  = STATE.view;
    var panel = STATE.rightPanel;
    document.querySelectorAll('.sidebar .nav-item').forEach(function (btn) {
      var v = btn.dataset.view;
      var active =
        (v === 'markets'  && view === 'markets'  && (panel === null || panel === 'token')) ||
        (v === 'swap'     && view === 'markets'  && panel === 'swap')    ||
        (v === 'history'  && view === 'markets'  && panel === 'history') ||
        (v === 'settings' && view === 'settings');
      btn.classList.toggle('active', active);
    });
    updateSidebarIndicator();
  }

  function updateSidebarIndicator() {
    var indicator  = document.getElementById('sidebar-nav-indicator');
    if (!indicator) return;

    var activeItem = document.querySelector('.sidebar-nav .nav-item.active');
    if (!activeItem) { indicator.style.opacity = '0'; return; }

    if (!indicator._ready) {
      indicator.style.transition = 'none';
      indicator.style.height     = activeItem.offsetHeight + 'px';
      indicator.style.transform  = 'translateY(' + activeItem.offsetTop + 'px)';
      indicator.style.opacity    = '1';
      indicator._ready = true;
      requestAnimationFrame(function () { indicator.style.transition = ''; });
      return;
    }

    indicator.style.opacity   = '1';
    indicator.style.height    = activeItem.offsetHeight + 'px';
    indicator.style.transform = 'translateY(' + activeItem.offsetTop + 'px)';
  }

  var mobileWordmark  = document.querySelector('.mobile-wordmark');
  var mobileBottomNav = document.getElementById('mobile-bottom-nav');

  function setMobileView(view) {
    Object.keys(mobileViews).forEach(function (key) {
      mobileViews[key].hidden = (key !== view);
    });

    /* Back arrow: only on detail views */
    mobileBack.classList.toggle('visible', view === 'token');

    /* Bottom nav: slides away when drilling into any detail view */
    var topLevel = (view === 'markets' || view === 'swap');
    mobileBottomNav.classList.toggle('nav-hidden', !topLevel);

    /* Center wordmark: reflects context
     *  markets / swap → OBSIDEUM (Cinzel, bright)
     *  token          → symbol   (Electrolize, --em-2, wide tracking)
     *  history        → HISTORY  (Electrolize, dim, wide tracking)
     *  settings       → SETTINGS (Electrolize, dim, wide tracking)
     */
    mobileWordmark.classList.remove('ctx-token', 'ctx-section');
    if (view === 'token') {
      var tList = window.STATE && STATE.tokenList;
      var match = tList && tList.find(function (t) { return t.address === STATE.token; });
      mobileWordmark.textContent = match ? match.symbol : 'OBSIDEUM';
      mobileWordmark.classList.add('ctx-token');
    } else if (view === 'history' || view === 'settings') {
      mobileWordmark.textContent = view.toUpperCase();
      mobileWordmark.classList.add('ctx-section');
    } else {
      mobileWordmark.textContent = 'OBSIDEUM';
    }

    updateMobileNavActive(view);
  }

  function updateMobileNavActive(view) {
    var items = Array.from(document.querySelectorAll('.mobile-nav-item'));
    items.forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.mobileView === view);
    });
    var idx = items.findIndex(function (btn) { return btn.dataset.mobileView === view; });
    var indicator = document.getElementById('mobile-nav-indicator');
    if (indicator && idx > -1) {
      indicator.style.transform = 'translateX(' + (idx * 100) + '%)';
    }
  }

  function navigateMobile(view) {
    setState({ prevMobileView: STATE.mobileView, mobileView: view });
  }

  function truncateAddress(addr) {
    return addr ? addr.slice(0, 6) + '...' + addr.slice(-4) : '';
  }

  document.addEventListener('state:view',       function (e) { setView(e.detail); });
  document.addEventListener('state:rightPanel',  function (e) { setRightPanel(e.detail); updateSidebarActive(); });
  document.addEventListener('state:mobileView',  function (e) { setMobileView(e.detail); });

  document.addEventListener('state:wallet', function (e) {
    var addr = e.detail;
    sidebarWallet.textContent = addr ? truncateAddress(addr) : '';
    sidebarWallet.style.color = '';
    var dot = document.getElementById('swb-dot');
    if (dot) dot.classList.toggle('connected', !!addr);
  });

  document.addEventListener('state:ens', function (e) {
    var ens = e.detail;
    if (!ens || !STATE.wallet) return;
    sidebarWallet.style.opacity = '0';
    setTimeout(function () {
      sidebarWallet.textContent   = ens;
      sidebarWallet.style.color   = 'var(--em-2)';
      sidebarWallet.style.opacity = '1';
    }, 100);
  });

  document.addEventListener('state:network', function (e) {
    var id   = e.detail;
    var name = NETWORK_NAMES[id] || ('Chain ' + id);
    sidebarNetwork.textContent = id ? name : '';
    var wrong = id && STATE.settings.defaultNetwork && id !== STATE.settings.defaultNetwork;
    sidebarNetwork.style.color = wrong ? 'var(--warn)' : '';
  });

  document.querySelectorAll('.sidebar-nav .nav-item').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var v = btn.dataset.view;
      if      (v === 'markets') setState({ view: 'markets', rightPanel: null });
      else if (v === 'swap')    setState({ view: 'markets', rightPanel: 'swap' });
      else if (v === 'history') setState({ view: 'markets', rightPanel: 'history' });
    });
  });

  document.getElementById('settings-btn').addEventListener('click', function () {
    setState({ view: 'settings' });
  });

  document.querySelectorAll('.mobile-nav-item').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var view = btn.dataset.mobileView;
      if (view) navigateMobile(view);
    });
  });

  document.getElementById('mobile-history-btn').addEventListener('click', function () {
    navigateMobile('history');
  });
  document.getElementById('mobile-settings-btn').addEventListener('click', function () {
    navigateMobile('settings');
  });

  mobileBack.addEventListener('click', function () {
    navigateMobile(STATE.prevMobileView || 'markets');
  });

  window.addEventListener('resize', updateSidebarIndicator);

  (function () {
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight);
  }());

  setView(STATE.view              || 'markets');
  setMobileView(STATE.mobileView  || 'markets');
  setRightPanel(STATE.rightPanel);
  requestAnimationFrame(updateSidebarIndicator);

}());
</script>

<!-- ── Phase 3A/3B — Token Row Component ────────────────────────── -->
<script>
(function () {
